name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  plugin:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
