id = "drover.notify"
name = "Drover Notify"
version = "0.1.1"
min_herdr_version = "0.7.0"
description = "Sends Drover notifications when an agent becomes blocked or done."
platforms = ["linux", "macos", "windows"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "bin/handle-blocked.mjs"]
